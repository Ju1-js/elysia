name: Build Flatpak
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - 'ci-test'

jobs:
  build-flatpak:
    name: Build Flatpak Bundle
    runs-on: trixie
    container:
      image: node:20
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Generate cargo sources
        working-directory: ./flatpak
        run: |
          python3 ./flatpak-builder-tools/cargo/flatpak-cargo-generator.py ../Cargo.lock -o cargo-sources.json

      - name: Build Flatpak
        working-directory: ./flatpak
        run: |
          flatpak-builder --repo=repo --force-clean build-dir wine.dawn.dawnwinery.elysia.yml

      - name: Create bundle
        working-directory: ./flatpak
        run: |
          flatpak build-bundle repo elysia.flatpak wine.dawn.dawnwinery.elysia
          sha512sum elysia.flatpak > elysia.flatpak.sha512sum

      - name: Upload artifact elysia.flatpak
        uses: actions/upload-artifact@v3
        with:
          name: elysia.flatpak
          path: ./flatpak/elysia.flatpak

      - name: Upload artifact elysia.flatpak.sha512sum
        uses: actions/upload-artifact@v3
        with:
          name: elysia.flatpak.sha512sum
          path: ./flatpak/elysia.flatpak.sha512sum

  release:
    name: Release
    needs: [build-flatpak]
    runs-on: trixie
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: ./artifacts

      - name: Merge artifacts
        run: |
          mkdir upload
          mv ./artifacts/*/* ./upload

      - name: Create release
        uses: actions/forgejo-release@v2.7.3
        with:
          direction: upload
          tag: ${{ github.ref_name }}
          release-dir: ./upload
