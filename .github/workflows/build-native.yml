name: Build Native Binary
on:
  workflow_call:
  workflow_dispatch:
jobs:
  build-native:
    name: Build Native Binary
    runs-on: trixie
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
      
      - name: Build Elysia
        run: |
          docker run --rm \
            -v "$(pwd):/workspace" \
            -w /workspace \
            ubuntu:24.04 \
            bash -c '
              set -e
              
              # Add PPA and update
              apt-get update
              apt-get install -y software-properties-common
              add-apt-repository -y ppa:ubuntuhandbook1/ffmpeg8
              apt-get update
              
              # Install dependencies
              apt-get install -y \
                build-essential \
                clang \
                curl \
                pkg-config \
                libssl-dev \
                libgtk-3-dev \
                libasound2-dev \
                libxkbcommon-dev \
                libwayland-dev \
                libavutil-dev \
                libavcodec-dev \
                libavformat-dev \
                libavfilter-dev \
                libavdevice-dev
              
              # Install Rust
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
              source $HOME/.cargo/env
              
              # Build Elysia
              cargo build --bin elysia --release
              
              # Generate checksum
              cd target/release
              sha512sum elysia > elysia.sha512sum
            '
      
      - name: Upload artifact elysia
        uses: actions/upload-artifact@v3
        with:
          name: elysia
          path: target/release/elysia
      
      - name: Upload artifact elysia.sha512sum
        uses: actions/upload-artifact@v3
        with:
          name: elysia.sha512sum
          path: target/release/elysia.sha512sum
