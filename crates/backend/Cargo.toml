[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
common = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
stream-unpacker = { workspace = true }
bytes = "1.10.1"
cacache = { version = "13.1.0", features = ["libc", "memmap2", "mmap", "tokio-runtime"], default-features = false }
tar = "0.4.44"
async-trait = "0.1.89"
md5 = "0.8.0"
stream-unpack = "1.0.1"
lazy_static = "1.5"
zip = "6.0.0"
enum-table = { version = "2.1.2", features = ["serde"] }
flate2 = "1.1.5"
xz2 = "0.1.7"
sha2 = "0.10.9"
tokio-stream = "0.1.17"
which = "8.0.0"
rodio = "0.21.1"
random = "0.14.0"
